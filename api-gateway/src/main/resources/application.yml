server:
  port: 8099

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          # Do not auto-create a route for every registered service; the explicit
          # routes below are easier to reason about and to secure.
          enabled: false
      routes:
        - id: order-service
          # lb:// means "ask Eureka for an instance of ORDER-SERVICE"
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders/**

        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/v1/inventory/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: WARN
