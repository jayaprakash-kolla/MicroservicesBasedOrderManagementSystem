# Builds the showcase site in frontend/ and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". After that, every push to main that touches
# frontend/ redeploys the site to https://<user>.github.io/<repository>/.
#
# The published site runs in simulation mode only: GitHub Pages serves static
# files, so there is no gateway behind it. Live mode is for `npm run dev`
# on your own machine.
name: Deploy showcase site

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
