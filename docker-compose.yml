# Kafka is the only external service this system needs.
# Each microservice runs its own in-memory H2 database inside its own JVM.
#
#   docker compose up -d
#

services:

  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: oms-kafka
    ports:
      - "19092:19092"
    environment:
      # KRaft mode: no separate ZooKeeper container required.
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      # Two client listeners, because a broker hands every client the address to
      # reconnect on, and "localhost" means something different in each place:
      #   EXTERNAL localhost:19092 -> the microservices running on the host
      #   INTERNAL kafka:29092     -> other containers (kafka-ui); not published
      KAFKA_CFG_LISTENERS: "INTERNAL://:29092,EXTERNAL://:19092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:19092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Topics are created on first use, so no manual setup step is needed.
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:19092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Web UI for inspecting topics, messages, and consumer lag.
  # Open http://localhost:18090 once it is up.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: oms-kafka-ui
    depends_on:
      - kafka
    ports:
      - "18090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
