server:
  port: 8083

spring:
  application:
    name: payment-service

  # payment-service's OWN database
  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.jayaprakash.oms.common.events

# ---------- simulated card processor ----------
# Any order total strictly above this is declined. Lower it to trigger the
# compensating half of the saga on demand.
payment:
  decline-above-amount: 100000

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

logging:
  level:
    com.jayaprakash.oms: INFO
    org.apache.kafka: WARN
    com.netflix.discovery: WARN
